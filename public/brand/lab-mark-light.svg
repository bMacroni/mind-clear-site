<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <!-- Mind Clear Lab mark — light version -->
  <!-- Neural waveform: scattered input resolving to calm baseline -->
  <path d="M8 52 L18 52 L22 36 L27 68 L32 28 L37 72 L42 40 L46 56 L50 52 L88 52"
        stroke="#0E1929" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
