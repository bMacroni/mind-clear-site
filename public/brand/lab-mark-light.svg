  <line x1="8" y1="66" x2="88" y2="66" stroke="#0E1929" stroke-width="1" opacity="0.12"/>
  <!-- Amber resolution segment — chaos to clarity -->
  <path d="M50 52 L88 52" stroke="#C8922A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
